# Checks every push and pull request: the production build with its guards,
# then the headless suites from tests/e2e/ against the dev server.
#
# Fast by design, so it never holds up shipping. Three ideas:
#
#   1. Only what a change can reach. `changes` reads the files a pull request
#      touches: docs and Markdown alone run nothing (except docs/architecture.md,
#      which the build job's architecture step checks); src/app/studio/,
#      src/features/studio/ and the studio's suites alone skip the public
#      suites; src/app/public-map/, src/features/published-map/, public/ and
#      the public suites alone skip the studio's; src/app/contribute/,
#      src/features/contribute/ and the contributor page's suites alone run the
#      build and the contributor page's suites only. Anything else — shared code
#      (Turnstile and the locator among it), the build, the lockfile, this
#      file — runs both. A push to main
#      or staging, the nightly run and "Run workflow" run everything.
#   2. Every suite at once. Each suite is its own job, so the run takes as
#      long as the slowest suite, not the sum of them all. commuter-test, the
#      slowest by far, runs as three parts (COMMUTER_PART, see its top). What
#      every job repeats is made once: the build job makes the preview builds
#      the built-app suites run, and Playwright's Chromium is kept between runs.
#   3. The drawing suites off the pull request's path. group, regression-
#      gestures, hotspot, snap, extend and studio-phone draw through the public OSRM demo
#      router (about one request a second, shared with the world) and read
#      the live tables: slow, and at the router's mercy. They run on every
#      push to main or staging (so a merge that breaks them is red on the
#      branch within minutes), nightly on the default branch, and on demand —
#      not on pull requests. A suite that fails is run once more after a
#      minute, as tests/e2e/README.md tells a person to do; a second failure
#      is real.
#
# The two checks a pull request shows keep their names, "Build and the public
# map" and "The editor": each passes when everything under it passed or was
# not needed, and fails when anything under it failed.
#
# The dev server reads .env.local, which is gitignored; here it is a copy of
# .env.production, whose values are public by design (see that file), with the basemap
# host put back to OpenFreeMap: the suites stub tiles.openfreemap.org, and none should
# depend on Para's live tiles server.
#
# A commit the publish-map workflow pushes (with a deploy key, which does start
# workflows) changes only public/data/, so a push of that alone skips CI:
# the drawing suites would run nightly through the shared OSRM router for a
# file the publish has already checked, and the nightly run at 05:00 covers
# main right after it anyway.
name: CI

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - 'public/data/**'
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:00 in Manila (UTC+8): after the map's nightly publish at 04:00.
    - cron: '0 21 * * *'

# A newer push to the same branch cancels the run for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What the change can reach. Outputs 'true' or 'false'.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.scope.outputs.public }}
      studio: ${{ steps.scope.outputs.studio }}
      contribute: ${{ steps.scope.outputs.contribute }}
      drawing: ${{ steps.scope.outputs.drawing }}
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The suites that run on a build (preview-suite): every one for the public map, the
          # contributor page's own alone for the contributor page.
          ALL_PREVIEWS='[{"suite":"pwa-test","basemap":"openfreemap"},{"suite":"pwa-test","basemap":"own-tiles"},{"suite":"handover-test","basemap":"openfreemap"},{"suite":"contribute-offline-test","basemap":"openfreemap"}]'
          CONTRIBUTE_PREVIEWS='[{"suite":"contribute-offline-test","basemap":"openfreemap"}]'
          if [ "$EVENT" != "pull_request" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
            echo "studio=true" >> "$GITHUB_OUTPUT"
            echo "contribute=true" >> "$GITHUB_OUTPUT"
            echo "drawing=true" >> "$GITHUB_OUTPUT"
            echo "preview=$ALL_PREVIEWS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "drawing=false" >> "$GITHUB_OUTPUT"
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "Changed:"; echo "$files" | sed 's/^/  /'
          public=false; studio=false; contribute=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              docs/architecture.md) public=true; studio=true ;;
              docs/*|*.md) ;;
              src/app/studio/*|src/features/studio/*|tests/e2e/turnstile-test.mjs|tests/e2e/studio-scale-test.mjs|tests/e2e/studio-contributors-test.mjs|tests/e2e/studio-public-view-test.mjs|tests/e2e/studio-two-editors-test.mjs|tests/e2e/save-test.mjs|tests/e2e/save-drafts-test.mjs|tests/e2e/group-test.mjs|tests/e2e/regression-gestures.mjs|tests/e2e/hotspot-test.mjs|tests/e2e/snap-test.mjs|tests/e2e/extend-test.mjs|tests/e2e/studio-phone-test.mjs)
                studio=true ;;
              src/app/public-map/*|src/features/published-map/*|public/*|tests/e2e/commuter-test.mjs|tests/e2e/phone-test.mjs|tests/e2e/where-test.mjs|tests/e2e/scale-test.mjs|tests/e2e/pwa-test.mjs|tests/e2e/own-tiles-stand-in.mjs|tests/e2e/handover-test.mjs|tests/e2e/fixtures/*|tests/e2e/gate-test.mjs|tests/e2e/loop-test.mjs)
                public=true ;;
              src/app/contribute/*|src/features/contribute/*|tests/e2e/contribute-test.mjs|tests/e2e/contribute-offline-test.mjs|tests/e2e/upload-test.mjs|tests/e2e/account-test.mjs|tests/e2e/profile-test.mjs|tests/e2e/claim-test.mjs)
                contribute=true ;;
              *) public=true; studio=true ;;
            esac
          done <<< "$files"
          # The public map's suites include the contributor page's.
          [ "$public" = true ] && contribute=true
          preview='[]'
          [ "$contribute" = true ] && preview=$CONTRIBUTE_PREVIEWS
          [ "$public" = true ] && preview=$ALL_PREVIEWS
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"
          echo "contribute=$contribute" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          echo "public=$public studio=$studio contribute=$contribute"

  build:
    name: Build and unit checks
    needs: changes
    if: needs.changes.outputs.public == 'true' || needs.changes.outputs.studio == 'true' || needs.changes.outputs.contribute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prettier, as .prettierrc asks: a file left unformatted fails here.
      - name: Formatting
        run: npm run format:check
      # ESLint: the rules the standards name are errors (eslint.config.js).
      - name: Lint
        run: npm run lint
      # docs/architecture.md is generated from src/: a change to the structure
      # that did not regenerate it fails here (`npm run docs:architecture`).
      - name: Architecture page
        run: npm run docs:architecture:check
      # Import boundaries, no editor code on /, the installable app's files.
      - name: Build, with the boundary and build checks
        run: npm run build
      # Node's own test runner, no browser: every tests/unit/*-test.mjs.
      - name: The unit checks
        run: npm run test:unit
      # The builds pwa-test, handover-test and contribute-offline-test run in `vite preview`, made
      # once here for preview-suite. Each reads the suites' .env.local as well as .env.production
      # (a build reads both, the latter winning), so it is the build those suites would make.
      # OpenFreeMap is named for all but pwa-test's own-tiles run, which is built for a stand-in
      # of the tiles server on 127.0.0.1 (tests/e2e/own-tiles-stand-in.mjs), never the real one.
      - name: The preview builds
        if: needs.changes.outputs.preview != '[]'
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          echo VITE_CONTRIBUTIONS=0 >> .env.local
          echo VITE_STUDIO_DRAFTS=0 >> .env.local
          VITE_BASEMAP_HOST=https://tiles.openfreemap.org npm run build
          mv dist preview-openfreemap
          VITE_BASEMAP_HOST=http://127.0.0.1:4390 npm run build
          mv dist preview-own-tiles
          rm .env.local
      - name: Keep the OpenFreeMap preview build
        if: needs.changes.outputs.preview != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: preview-openfreemap
          path: preview-openfreemap
          include-hidden-files: true
          retention-days: 1
      - name: Keep the own-tiles preview build
        if: needs.changes.outputs.public == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-own-tiles
          path: preview-own-tiles
          include-hidden-files: true
          retention-days: 1

  # The public map's pages, one job a suite, against the dev server. Each needs only the published
  # map file and OpenFreeMap's tiles; gate-test opens /studio/'s sign-in door.
  public-suite:
    name: ${{ matrix.suite }}${{ matrix.part && format(' ({0} of 3)', matrix.part) || '' }}
    needs: changes
    if: needs.changes.outputs.public == 'true'
    runs-on: ubuntu-latest
    # commuter-test's first part takes close to 20 minutes, and grows with the
    # map; 30 leaves it room.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [gate-test, phone-test, where-test, scale-test, loop-test]
        include:
          - { suite: commuter-test, part: 1 }
          - { suite: commuter-test, part: 2 }
          - { suite: commuter-test, part: 3 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's Chromium, at the version package-lock pins, kept between runs; its system
      # packages are installed every time.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Give the dev server the public database address and key
        # Cloudflare's always-pass Turnstile key in place of the real one, which
        # answers only real browsers on Para's own hostnames.
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          # The suites written for the recorder and the editor run with uploads
          # off; upload-test turns them on below, against its stand-in.
          echo VITE_CONTRIBUTIONS=0 >> .env.local
          # and with the studio saving straight to the approved rows, as they
          # were written for; the review suites run on the isolated preview.
          echo VITE_STUDIO_DRAFTS=0 >> .env.local
      - name: Start the dev server
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "The dev server did not answer in 60 s"; cat vite.log; exit 1
      - name: ${{ matrix.suite }}
        run: node tests/e2e/${{ matrix.suite }}.mjs
        env:
          COMMUTER_PART: ${{ matrix.part && format('{0}/3', matrix.part) || '' }}
      - name: Keep the screenshots and the dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}${{ matrix.part && format('-{0}', matrix.part) || '' }}-screenshots
          path: |
            *.png
            vite.log
          if-no-files-found: ignore

  # The contributor page, one job a suite, against the dev server.
  contribute-suite:
    name: ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.contribute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            contribute-test,
            upload-test,
            account-test,
            forgot-password-test,
            claim-test,
            profile-test,
          ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's Chromium, at the version package-lock pins, kept between runs; its system
      # packages are installed every time.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Give the dev server the public database address and key
        # Cloudflare's always-pass Turnstile key in place of the real one, which
        # answers only real browsers on Para's own hostnames.
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          # The suites written for the recorder and the editor run with uploads
          # off; upload-test turns them on below, against its stand-in.
          echo VITE_CONTRIBUTIONS=0 >> .env.local
          # and with the studio saving straight to the approved rows, as they
          # were written for; the review suites run on the isolated preview.
          echo VITE_STUDIO_DRAFTS=0 >> .env.local
      # upload-test, account-test, forgot-password-test, claim-test and profile-test turn uploads back on for their own dev server, against a
      # stand-in for Supabase.
      - name: Turn uploads on, for upload-test, account-test, forgot-password-test, claim-test and profile-test
        if: matrix.suite != 'contribute-test'
        run: |
          echo VITE_CONTRIBUTIONS=1 >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
      - name: Start the dev server
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "The dev server did not answer in 60 s"; cat vite.log; exit 1
      - name: ${{ matrix.suite }}
        run: node tests/e2e/${{ matrix.suite }}.mjs
        env:
          PARA_TURNSTILE: ${{ matrix.suite != 'contribute-test' && '1' || '' }}
      - name: Keep the screenshots and the dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-screenshots
          path: |
            *.png
            vite.log
          if-no-files-found: ignore

  # The built app: pwa-test and handover-test (:4173) and contribute-offline-test (:4174) start
  # and stop their own `vite preview` on the build job's preview builds. pwa-test runs a second
  # time for Para's own tiles server, against a stand-in for it (tests/e2e/own-tiles-stand-in.mjs).
  # Which of them run is the changes job's `preview`.
  preview-suite:
    name: ${{ matrix.suite }}${{ matrix.basemap == 'own-tiles' && ' (own tiles)' || '' }}
    needs: [changes, build]
    if: needs.changes.outputs.preview != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.preview) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's Chromium, at the version package-lock pins, kept between runs; its system
      # packages are installed every time.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Give the dev server the public database address and key
        # Cloudflare's always-pass Turnstile key in place of the real one, which
        # answers only real browsers on Para's own hostnames.
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          # The suites written for the recorder and the editor run with uploads
          # off; upload-test turns them on below, against its stand-in.
          echo VITE_CONTRIBUTIONS=0 >> .env.local
          # and with the studio saving straight to the approved rows, as they
          # were written for; the review suites run on the isolated preview.
          echo VITE_STUDIO_DRAFTS=0 >> .env.local
      - name: The preview build
        uses: actions/download-artifact@v4
        with:
          name: preview-${{ matrix.basemap }}
          path: dist
      - name: ${{ matrix.suite }}
        run: node tests/e2e/${{ matrix.suite }}.mjs
      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}${{ matrix.basemap == 'own-tiles' && '-own-tiles' || '' }}-screenshots
          path: |
            *.png
            vite.log
          if-no-files-found: ignore

  # The editor against stand-ins for the database, no router: studio-scale
  # (5,000 directions, what the editor asks for and how soon it opens; and the
  # Contributors map with 1,000 uploads), save-test (the save flows, signed in)
  # and studio-contributors (the Contributors map's actions). No retry needed.
  studio-suite:
    name: ${{ matrix.suite }}
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    # save-test normally takes ~14 min; 15 left no margin for a slow runner,
    # and a timeout-cancel fails the "The editor" aggregate.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            studio-scale-test,
            studio-contributors-test,
            save-test,
            turnstile-test,
            studio-public-view-test,
            studio-two-editors-test,
            save-drafts-test,
          ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's Chromium, at the version package-lock pins, kept between runs; its system
      # packages are installed every time.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Give the dev server the public database address and key
        # Cloudflare's always-pass Turnstile key in place of the real one, which
        # answers only real browsers on Para's own hostnames.
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          # The suites written for the recorder and the editor run with uploads
          # off; upload-test turns them on below, against its stand-in.
          echo VITE_CONTRIBUTIONS=0 >> .env.local
          # and with the studio saving straight to the approved rows, as they
          # were written for; the review suites run on the isolated preview.
          echo VITE_STUDIO_DRAFTS=0 >> .env.local
      # The two suites that open the Contributors map read uploads from their
      # own stand-in, so they run with uploads on.
      - name: Turn uploads on, for the Contributors map's suites
        if: matrix.suite == 'studio-scale-test' || matrix.suite == 'studio-contributors-test'
        run: echo VITE_CONTRIBUTIONS=1 >> .env.local
      # The Public map view exists only with drafts on, and save-drafts-test runs
      # save-test's flows on the drafts path; the later line wins.
      - name: Turn the studio's drafts on for studio-public-view-test, studio-two-editors-test and save-drafts-test
        if: matrix.suite == 'studio-public-view-test' || matrix.suite == 'studio-two-editors-test' || matrix.suite == 'save-drafts-test'
        run: echo VITE_STUDIO_DRAFTS=1 >> .env.local
      # Cloudflare's always-pass test key: turnstile-test stands in for its script.
      - name: Give turnstile-test a Turnstile site key
        if: matrix.suite == 'turnstile-test'
        run: echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
      - name: Start the dev server
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "The dev server did not answer in 60 s"; cat vite.log; exit 1
      - name: ${{ matrix.suite }}
        run: node tests/e2e/${{ matrix.suite }}.mjs
      - name: Keep the screenshots and the dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-screenshots
          path: |
            *.png
            vite.log
          if-no-files-found: ignore

  # The drawing suites, against /studio/?e2e=1, the public router and the live
  # tables. Not on pull requests (see the top of this file). One at a time —
  # the router is shared — and once more after a minute if it was busy.
  drawing:
    name: The drawing suites
    needs: changes
    if: needs.changes.outputs.drawing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright's Chromium, at the version package-lock pins, kept between runs; its system
      # packages are installed every time.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Give the dev server the public database address and key
        # Cloudflare's always-pass Turnstile key in place of the real one, which
        # answers only real browsers on Para's own hostnames.
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          # The suites written for the recorder and the editor run with uploads
          # off; upload-test turns them on below, against its stand-in.
          echo VITE_CONTRIBUTIONS=0 >> .env.local
          # and with the studio saving straight to the approved rows, as they
          # were written for; the review suites run on the isolated preview.
          echo VITE_STUDIO_DRAFTS=0 >> .env.local
      - name: Start the dev server
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "The dev server did not answer in 60 s"; cat vite.log; exit 1
      - name: The drawing suites
        run: |
          set +e
          status=0
          for suite in group-test regression-gestures hotspot-test snap-test extend-test studio-phone-test; do
            echo "::group::$suite"
            if node "tests/e2e/$suite.mjs"; then
              echo "::endgroup::"
              continue
            fi
            echo "$suite failed; waiting a minute for the router, then once more"
            sleep 60
            if node "tests/e2e/$suite.mjs"; then
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"
            echo "::error::$suite failed twice"
            status=1
          done
          exit $status
      - name: Keep the screenshots and the dev server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drawing-screenshots
          path: |
            *.png
            vite.log
          if-no-files-found: ignore

  # The two checks a pull request shows, under the names they always had.
  # Passed when everything under them passed or was not needed.
  public:
    name: Build and the public map
    needs: [changes, build, public-suite, contribute-suite, preview-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.build.result }} ${{ needs.public-suite.result }} ${{ needs.contribute-suite.result }} ${{ needs.preview-suite.result }}
        run: |
          echo "changes, build, public suites, contributor suites, preview suites: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac

  studio:
    name: The editor
    needs: [changes, build, studio-suite, drawing]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.build.result }} ${{ needs.studio-suite.result }} ${{ needs.drawing.result }}
        run: |
          echo "changes, build, studio suites, drawing suites: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
