# Checks every push and pull request: the production build with its guards,
# then the headless suites from tests/e2e/ against the dev server.
#
# Fast by design, so it never holds up shipping. Three ideas:
#
#   1. Only what a change can reach. `changes` reads the files a pull request
#      touches: docs and Markdown alone run nothing. Files only the build job
#      reads run the build job alone, no suite: docs/architecture.md (its
#      architecture step), tests/unit/ (its unit checks) and the scripts it
#      alone runs (scripts/checks/check-build.mjs, build-weight.mjs and build/,
#      scripts/docs/, scripts/node/ts-resolve*.mjs). src/app/studio/,
#      src/features/studio/ and the studio's suites alone skip the public
#      suites; src/app/public-map/, src/features/published-map/, public/ and
#      the public suites alone skip the studio's; src/app/contribute/,
#      src/features/contribute/ and the contributor page's suites alone run the
#      build and the contributor page's suites only. Anything else — shared code
#      (Turnstile and the locator among it), the build, the lockfile, this
#      file — runs both. A push to main
#      or staging, the nightly run and "Run workflow" run everything.
#   2. Every suite at once, in jobs sized by measured time, so the run takes as
#      long as the slowest job, not the sum of them all. The suites under a
#      minute or so share a job, since each job repeats its setup and waits for
#      one of the free plan's ~20 runners; commuter-test, the slowest by far,
#      runs as six parts (COMMUTER_PART, see its top), phone-test as three, the
#      drawing suites as two. What every job repeats is made once: the build job makes the preview builds
#      the built-app suites run, and Playwright's Chromium is kept between runs.
#   3. The drawing suites only where they are needed. group, regression-
#      gestures, hotspot, snap, extend and studio-phone draw through the public OSRM demo
#      router (about one request a second, shared with the world) and read
#      the live tables: slow, and at the router's mercy. They run on every
#      push to main or staging (so a merge that breaks them is red on the
#      branch within minutes), nightly on the default branch, on demand, and
#      on a pull request that changes the editor (src/app/studio,
#      src/features/studio), the map it draws on (src/features/routes/map), the
#      routes' geometry rules (src/features/routes/geo), the suites themselves or
#      the test helpers they load, so a break is caught before it merges. A suite
#      that fails is run once more after a minute, as tests/e2e/README.md tells
#      a person to do; a second failure is real.
#
# The two checks a pull request shows keep their names, "Build and the public
# map" and "The editor": each passes when everything under it passed or was
# not needed, and fails when anything under it failed.
#
# The dev server reads .env.local, which is gitignored; here it is a copy of
# .env.production, whose values are public by design (see that file), with the basemap
# host put back to OpenFreeMap: the suites stub tiles.openfreemap.org, and none should
# depend on Para's live tiles server.
#
# A commit the publish-map workflow pushes (with a deploy key, which does start
# workflows) changes only public/data/, so a push of that alone skips CI:
# the drawing suites would run nightly through the shared OSRM router for a
# file the publish has already checked, and the nightly run at 05:00 covers
# main right after it anyway.
name: CI

on:
  push:
    branches: [main, staging]
    paths-ignore:
      - 'public/data/**'
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:00 in Manila (UTC+8): after the map's nightly publish at 04:00.
    - cron: '0 21 * * *'

# On a pull request a newer push cancels the run for the older one: only its newest commit
# matters. On main and staging a run that has started is never cancelled, so the commit it
# checks gets its full verdict. GitHub keeps one run going and one waiting per group: a newer
# push takes the place of the one still waiting, and every run that starts finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The suites' outside services: live on main and staging pushes, the nightly run and a run by
# hand; on a pull request, the suites' stand-ins (recorded answers, fake services), so a PR run
# reaches no host off the runner. Read by tests/e2e (lib/harness.mjs and the stand-ins) as set
# or unset. A stand-in gone stale shows as a live run failing where its PR run passed.
env:
  PARA_LIVE_SERVICES: ${{ github.event_name != 'pull_request' && '1' || '' }}

jobs:
  # What the change can reach. Outputs 'true' or 'false'.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.scope.outputs.public }}
      studio: ${{ steps.scope.outputs.studio }}
      contribute: ${{ steps.scope.outputs.contribute }}
      # The build job: on with any of the three above, or alone for a file only it reads.
      build: ${{ steps.scope.outputs.build }}
      drawing: ${{ steps.scope.outputs.drawing }}
      preview: ${{ steps.scope.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # The suites that run on a build (preview-suite): every one for the public map, the
          # contributor page's own alone for the contributor page.
          ALL_PREVIEWS='[{"suite":"pwa-test","basemap":"openfreemap"},{"suite":"pwa-test","basemap":"own-tiles"},{"suite":"handover-test","basemap":"openfreemap"},{"suite":"contribute-offline-test","basemap":"openfreemap"}]'
          CONTRIBUTE_PREVIEWS='[{"suite":"contribute-offline-test","basemap":"openfreemap"}]'
          if [ "$EVENT" != "pull_request" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
            echo "studio=true" >> "$GITHUB_OUTPUT"
            echo "contribute=true" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "drawing=true" >> "$GITHUB_OUTPUT"
            echo "preview=$ALL_PREVIEWS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "Changed:"; echo "$files" | sed 's/^/  /'
          public=false; studio=false; contribute=false; build=false; drawing=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # The suites' shared helpers and fixtures (the harness, the stand-ins, the recorded
            # answers): every suite may load them, so a change to one runs them all.
            case "$f" in
              tests/e2e/lib/*|tests/e2e/fixtures/*)
                public=true; studio=true; contribute=true; drawing=true
                continue ;;
            esac
            # The drawing suites, for a change to the editor, the map it draws on, the routes'
            # geometry rules, the suites themselves or the helpers they load (lib/studio.mjs is
            # theirs alone): what they draw with. Shared code (src/shared, the design system, the
            # build's config) does not select them; a push to staging runs them, which catches it.
            case "$f" in
              src/app/studio/*|src/features/studio/*|src/features/routes/geo/*|src/features/routes/map/*|tests/e2e/group-test.mjs|tests/e2e/regression-gestures.mjs|tests/e2e/hotspot-test.mjs|tests/e2e/snap-test.mjs|tests/e2e/extend-test.mjs|tests/e2e/studio-phone-test.mjs|tests/e2e/lib/studio.mjs|tests/e2e/lib/harness.mjs|tests/e2e/lib/looks.mjs|tests/e2e/lib/fake-studio-db.mjs)
                drawing=true ;;
            esac
            # The published map file: the public suites read it, and so does the studio's Public
            # map (studio-public-view-test checks it against this file).
            case "$f" in
              public/data/*) studio=true ;;
            esac
            case "$f" in
              # Read by the build job alone: its architecture step, its unit checks, its guards.
              docs/architecture.md|tests/unit/*|scripts/checks/check-build.mjs|scripts/checks/build-weight.mjs|scripts/checks/build/*|scripts/docs/*|scripts/node/ts-resolve.mjs|scripts/node/ts-resolve-hook.mjs)
                build=true ;;
              docs/*|*.md) ;;
              src/app/studio/*|src/features/studio/*|tests/e2e/turnstile-test.mjs|tests/e2e/studio-scale-test.mjs|tests/e2e/studio-contributors-test.mjs|tests/e2e/studio-public-view-test.mjs|tests/e2e/studio-two-editors-test.mjs|tests/e2e/save-test.mjs|tests/e2e/save-ikot-test.mjs|tests/e2e/save-edit-test.mjs|tests/e2e/save-drafts-test.mjs|tests/e2e/group-test.mjs|tests/e2e/regression-gestures.mjs|tests/e2e/hotspot-test.mjs|tests/e2e/snap-test.mjs|tests/e2e/extend-test.mjs|tests/e2e/studio-phone-test.mjs)
                studio=true ;;
              src/app/public-map/*|src/features/published-map/*|public/*|tests/e2e/commuter-test.mjs|tests/e2e/phone-test.mjs|tests/e2e/where-test.mjs|tests/e2e/scale-test.mjs|tests/e2e/pwa-test.mjs|tests/e2e/own-tiles-stand-in.mjs|tests/e2e/handover-test.mjs|tests/e2e/fixtures/*|tests/e2e/gate-test.mjs|tests/e2e/loop-test.mjs|tests/e2e/back-test.mjs|tests/e2e/map-pins-test.mjs)
                public=true ;;
              src/app/contribute/*|src/features/contribute/*|tests/e2e/contribute-test.mjs|tests/e2e/contribute-offline-test.mjs|tests/e2e/upload-test.mjs|tests/e2e/account-test.mjs|tests/e2e/profile-test.mjs|tests/e2e/claim-test.mjs)
                contribute=true ;;
              *) public=true; studio=true ;;
            esac
          done <<< "$files"
          # The public map's suites include the contributor page's.
          [ "$public" = true ] && contribute=true
          # Every suite's change also needs the build job.
          if [ "$public" = true ] || [ "$studio" = true ] || [ "$contribute" = true ]; then build=true; fi
          preview='[]'
          [ "$contribute" = true ] && preview=$CONTRIBUTE_PREVIEWS
          [ "$public" = true ] && preview=$ALL_PREVIEWS
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "studio=$studio" >> "$GITHUB_OUTPUT"
          echo "contribute=$contribute" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "drawing=$drawing" >> "$GITHUB_OUTPUT"
          echo "preview=$preview" >> "$GITHUB_OUTPUT"
          echo "public=$public studio=$studio contribute=$contribute build=$build drawing=$drawing"

      # Which areas of Para the pull request touches (areas.json): a warning, never a failure,
      # when it spans more than one.
      - name: Areas touched
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only "$BASE...$HEAD" | node scripts/checks/pr-areas.mjs

      # The glossary's banned words (scripts/checks/glossary-words.json) kept out of src/, docs/
      # and CONTEXT.md: CONTEXT.md's words, not the ones it says to avoid. Here, not in the build
      # job, because a change to the docs alone runs no build; it needs nothing but Node.
      - name: Glossary
        run: node scripts/checks/glossary.mjs

  build:
    name: Build and unit checks
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Prettier, as .prettierrc asks: a file left unformatted fails here.
      - name: Formatting
        run: npm run format:check
      # ESLint: the rules the standards name are errors (eslint.config.js).
      - name: Lint
        run: npm run lint
      # No new source file over 150 lines; the long ones already there are held to their length,
      # and on a pull request the list of them may only shrink (scripts/checks/long-files.mjs).
      - name: Long files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ] && git fetch --quiet --no-tags --depth=1 origin "$BASE"; then
            git show "$BASE:scripts/checks/long-files-baseline.json" > "$RUNNER_TEMP/long-files-base.json" 2> /dev/null || true
          fi
          node scripts/checks/long-files.mjs --base "$RUNNER_TEMP/long-files-base.json"
      # docs/architecture.md is generated from src/: a change to the structure
      # that did not regenerate it fails here (`npm run docs:architecture`).
      - name: Architecture page
        run: npm run docs:architecture:check
      # Import boundaries, no editor code on /, the installable app's files.
      - name: Build, with the boundary and build checks
        run: npm run build
      # Node's own test runner, no browser: every tests/unit/*-test.mjs.
      - name: The unit checks
        run: npm run test:unit
      # The code-health page: `npm run health` (long files, comments, stories, the build's
      # weights) on the run's summary, so every run shows it. It measures and never fails.
      - name: Code health
        if: always()
        run: npm run --silent health >> "$GITHUB_STEP_SUMMARY" || true
      # The builds pwa-test, handover-test and contribute-offline-test run in `vite preview`, made
      # once here for preview-suite. Each reads the suites' .env.local as well as .env.production
      # (a build reads both, the latter winning), so it is the build those suites would make.
      # OpenFreeMap is named for all but pwa-test's own-tiles run, which is built for a stand-in
      # of the tiles server on 127.0.0.1 (tests/e2e/own-tiles-stand-in.mjs), never the real one.
      # The own-tiles build only for a public change: pwa-test's own-tiles run is a public suite.
      - name: The preview builds
        if: needs.changes.outputs.preview != '[]'
        env:
          OWN_TILES: ${{ needs.changes.outputs.public }}
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          echo VITE_CONTRIBUTIONS=0 >> .env.local
          VITE_BASEMAP_HOST=https://tiles.openfreemap.org npm run build
          mv dist preview-openfreemap
          if [ "$OWN_TILES" = true ]; then
            VITE_BASEMAP_HOST=http://127.0.0.1:4390 npm run build
            mv dist preview-own-tiles
          fi
          rm .env.local
      - name: Keep the OpenFreeMap preview build
        if: needs.changes.outputs.preview != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-openfreemap
          path: preview-openfreemap
          include-hidden-files: true
          retention-days: 1
      # Made only for a public change (The preview builds, above).
      - name: Keep the own-tiles preview build
        if: needs.changes.outputs.public == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: preview-own-tiles
          path: preview-own-tiles
          include-hidden-files: true
          retention-days: 1

  # The public map's pages against the dev server. Each needs only the published map file and
  # OpenFreeMap's tiles; gate-test opens /studio/'s sign-in door. A job runs its `suites` one after
  # another, so the short ones share a runner's setup and a place in the queue (the free plan runs
  # about 20 jobs at once, across every run): gate, scale, map-pins, back, where and loop take
  # about 4 minutes together. commuter-test runs in six parts (COMMUTER_PART, see its top) and
  # phone-test in three (PHONE_PART, see its top).
  public-suite:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.public == 'true'
    runs-on: ubuntu-latest
    # The longest, a commuter part or a phone-test part, runs about 9 minutes; 30 is the margin.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: phone-test (1 of 3), slug: phone-1, suites: phone-test, phone: 1/3 }
          - { name: phone-test (2 of 3), slug: phone-2, suites: phone-test, phone: 2/3 }
          - { name: phone-test (3 of 3), slug: phone-3, suites: phone-test, phone: 3/3 }
          - name: The short public suites
            slug: short-public
            suites: gate-test scale-test map-pins-test back-test where-test loop-test
          - { name: commuter-test (1 of 6), slug: commuter-1, suites: commuter-test, part: 1/6 }
          - { name: commuter-test (2 of 6), slug: commuter-2, suites: commuter-test, part: 2/6 }
          - { name: commuter-test (3 of 6), slug: commuter-3, suites: commuter-test, part: 3/6 }
          - { name: commuter-test (4 of 6), slug: commuter-4, suites: commuter-test, part: 4/6 }
          - { name: commuter-test (5 of 6), slug: commuter-5, suites: commuter-test, part: 5/6 }
          - { name: commuter-test (6 of 6), slug: commuter-6, suites: commuter-test, part: 6/6 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node, npm ci, and Playwright's Chromium with its system packages, from the caches every
      # browser suite shares (the action's own comments).
      - uses: ./.github/actions/prepare-browser-suite
      - name: Give the dev server the public database address and key
        # Cloudflare's always-pass Turnstile key in place of the real one, which
        # answers only real browsers on Para's own hostnames.
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          # The suites written for the recorder and the editor run with uploads
          # off; upload-test turns them on below, against its stand-in.
          echo VITE_CONTRIBUTIONS=0 >> .env.local
      - name: Start the dev server
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "The dev server did not answer in 60 s"; cat vite.log; exit 1
      # Every suite of the job runs, and each one that fails is named; the job fails if any did.
      - name: ${{ matrix.suites }}
        env:
          SUITES: ${{ matrix.suites }}
          COMMUTER_PART: ${{ matrix.part }}
          PHONE_PART: ${{ matrix.phone }}
        run: |
          status=0
          for suite in $SUITES; do
            echo "::group::$suite"
            node "tests/e2e/$suite.mjs" || { echo "::error::$suite failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
      - name: Keep the screenshots and the dev server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.slug }}-screenshots
          path: |
            *.png
            vite.log
          if-no-files-found: ignore

  # The contributor page, against the dev server.
  contribute-suite:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.contribute == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # A job runs its `suites` one after another, as public-suite's do: the three under a minute
      # share a runner. All but contribute-test run with uploads on.
      matrix:
        include:
          - { name: contribute-test, slug: contribute-test, suites: contribute-test }
          - { name: upload-test, slug: upload-test, suites: upload-test, uploads: true }
          - { name: profile-test, slug: profile-test, suites: profile-test, uploads: true }
          - name: account-test, forgot-password-test, claim-test
            slug: account-flows
            suites: account-test forgot-password-test claim-test
            uploads: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node, npm ci, and Playwright's Chromium with its system packages, from the caches every
      # browser suite shares (the action's own comments).
      - uses: ./.github/actions/prepare-browser-suite
      - name: Give the dev server the public database address and key
        # Cloudflare's always-pass Turnstile key in place of the real one, which
        # answers only real browsers on Para's own hostnames.
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          # The suites written for the recorder and the editor run with uploads
          # off; upload-test turns them on below, against its stand-in.
          echo VITE_CONTRIBUTIONS=0 >> .env.local
      # upload-test, account-test, forgot-password-test, claim-test and profile-test turn uploads back on for their own dev server, against a
      # stand-in for Supabase.
      - name: Turn uploads on, for upload-test, account-test, forgot-password-test, claim-test and profile-test
        if: matrix.uploads
        run: |
          echo VITE_CONTRIBUTIONS=1 >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
      - name: Start the dev server
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "The dev server did not answer in 60 s"; cat vite.log; exit 1
      # Every suite of the job runs, and each one that fails is named; the job fails if any did.
      - name: ${{ matrix.suites }}
        env:
          SUITES: ${{ matrix.suites }}
          PARA_TURNSTILE: ${{ matrix.uploads && '1' || '' }}
        run: |
          status=0
          for suite in $SUITES; do
            echo "::group::$suite"
            node "tests/e2e/$suite.mjs" || { echo "::error::$suite failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
      - name: Keep the screenshots and the dev server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.slug }}-screenshots
          path: |
            *.png
            vite.log
          if-no-files-found: ignore

  # The built app: pwa-test and handover-test (:4173) and contribute-offline-test (:4174) start
  # and stop their own `vite preview` on the build job's preview builds. pwa-test runs a second
  # time for Para's own tiles server, against a stand-in for it (tests/e2e/own-tiles-stand-in.mjs).
  # Which of them run is the changes job's `preview`.
  preview-suite:
    name: ${{ matrix.suite }}${{ matrix.basemap == 'own-tiles' && ' (own tiles)' || '' }}
    needs: [changes, build]
    if: needs.changes.outputs.preview != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.preview) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node, npm ci, and Playwright's Chromium with its system packages, from the caches every
      # browser suite shares (the action's own comments).
      - uses: ./.github/actions/prepare-browser-suite
      # The build was made in the build job; `vite preview` serves it as it is.
      - name: The preview build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: preview-${{ matrix.basemap }}
          path: dist
      - name: ${{ matrix.suite }}
        run: node tests/e2e/${{ matrix.suite }}.mjs
      - name: Keep the screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.suite }}${{ matrix.basemap == 'own-tiles' && '-own-tiles' || '' }}-screenshots
          path: '*.png'
          if-no-files-found: ignore

  # The editor against stand-ins for the database, no router: studio-scale
  # (5,000 directions, what the editor asks for and how soon it opens; and the
  # Contributors map with 1,000 uploads), the save flows signed in in three parts
  # (save-test, save-ikot-test and save-edit-test, on lib/save-studio.mjs, every
  # save a draft the stand-in approves), the review flow's own suites
  # (save-drafts, studio-two-editors, studio-public-view, on lib/fake-studio-db.mjs)
  # and studio-contributors (the Contributors map's actions). No retry needed.
  studio-suite:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.studio == 'true'
    runs-on: ubuntu-latest
    # A slow runner has taken the save flows, run as one suite, past 25 min while
    # still passing. A timeout-cancel fails the "The editor" aggregate, so the
    # limit leaves room for that runner.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # A job runs its `suites` one after another, as public-suite's do: the ones under a minute
      # share a runner, grouped by the uploads setting their dev server needs.
      matrix:
        include:
          - name: studio-scale-test, studio-contributors-test
            slug: studio-uploads
            suites: studio-scale-test studio-contributors-test
            uploads: true
          - name: turnstile-test, studio-public-view-test, studio-two-editors-test
            slug: studio-review
            suites: turnstile-test studio-public-view-test studio-two-editors-test
          - { name: save-test, slug: save-test, suites: save-test }
          - { name: save-ikot-test, slug: save-ikot-test, suites: save-ikot-test }
          - { name: save-edit-test, slug: save-edit-test, suites: save-edit-test }
          - { name: save-drafts-test, slug: save-drafts-test, suites: save-drafts-test }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node, npm ci, and Playwright's Chromium with its system packages, from the caches every
      # browser suite shares (the action's own comments).
      - uses: ./.github/actions/prepare-browser-suite
      - name: Give the dev server the public database address and key
        # Cloudflare's always-pass Turnstile key in place of the real one, which
        # answers only real browsers on Para's own hostnames.
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          # The suites written for the recorder and the editor run with uploads
          # off; upload-test turns them on below, against its stand-in.
          echo VITE_CONTRIBUTIONS=0 >> .env.local
      # The two suites that open the Contributors map read uploads from their
      # own stand-in, so they run with uploads on.
      - name: Turn uploads on, for the Contributors map's suites
        if: matrix.uploads
        run: echo VITE_CONTRIBUTIONS=1 >> .env.local
      # Cloudflare's always-pass test key: turnstile-test stands in for its script.
      - name: Give turnstile-test a Turnstile site key
        if: contains(matrix.suites, 'turnstile-test')
        run: echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
      - name: Start the dev server
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "The dev server did not answer in 60 s"; cat vite.log; exit 1
      # Every suite of the job runs, and each one that fails is named; the job fails if any did.
      - name: ${{ matrix.suites }}
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          status=0
          for suite in $SUITES; do
            echo "::group::$suite"
            node "tests/e2e/$suite.mjs" || { echo "::error::$suite failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status
      - name: Keep the screenshots and the dev server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.slug }}-screenshots
          path: |
            *.png
            vite.log
          if-no-files-found: ignore

  # Every story renders and its play passes (scripts/checks/storybook-play.mjs), against the
  # built Storybook; the stories that failed when the check came in are listed, by area, in
  # storybook-play-baseline.json, which may only shrink.
  storybook:
    name: Storybook plays
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node, npm ci, and Playwright's Chromium with its system packages, from the caches every
      # browser suite shares (the action's own comments).
      - uses: ./.github/actions/prepare-browser-suite
      - name: Build Storybook
        run: npm run build-storybook -- --quiet
      - name: Every story renders and plays
        run: node scripts/checks/storybook-play.mjs storybook-static

  # The drawing suites, against /studio/?e2e=1, the public router and the live
  # tables. On a pull request only for the editor's own code (see the top of this file). In two
  # jobs of about 5 minutes each, by measured time (studio-phone-test alone takes about as long as
  # the other five); within a job one at a time, and once more after a minute if the router was busy.
  drawing:
    name: The drawing suites (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.drawing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              part: 1 of 2,
              slug: 1,
              suites: group-test regression-gestures hotspot-test snap-test extend-test,
            }
          - { part: 2 of 2, slug: 2, suites: studio-phone-test }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Node, npm ci, and Playwright's Chromium with its system packages, from the caches every
      # browser suite shares (the action's own comments).
      - uses: ./.github/actions/prepare-browser-suite
      - name: Give the dev server the public database address and key
        # Cloudflare's always-pass Turnstile key in place of the real one, which
        # answers only real browsers on Para's own hostnames.
        run: |
          cp .env.production .env.local
          echo VITE_BASEMAP_HOST=https://tiles.openfreemap.org >> .env.local
          echo VITE_TURNSTILE_SITE_KEY=1x00000000000000000000AA >> .env.local
          # The suites written for the recorder and the editor run with uploads
          # off; upload-test turns them on below, against its stand-in.
          echo VITE_CONTRIBUTIONS=0 >> .env.local
      - name: Start the dev server
        run: |
          npx vite --port 5173 --strictPort > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173/ && exit 0
            sleep 1
          done
          echo "The dev server did not answer in 60 s"; cat vite.log; exit 1
      - name: The drawing suites
        env:
          SUITES: ${{ matrix.suites }}
        run: |
          set +e
          status=0
          for suite in $SUITES; do
            echo "::group::$suite"
            if node "tests/e2e/$suite.mjs"; then
              echo "::endgroup::"
              continue
            fi
            # The one retry is for the live router, busy now and then. A PR run's router is a
            # recording once tests/e2e/fixtures/osrm/ exists, and then a failure is the code's.
            if [ -z "$PARA_LIVE_SERVICES" ] && [ -d tests/e2e/fixtures/osrm ]; then
              echo "::endgroup::"
              echo "::error::$suite failed"
              status=1
              continue
            fi
            echo "::warning::$suite needed the router retry"
            echo "$suite failed; waiting a minute for the router, then once more"
            sleep 60
            if node "tests/e2e/$suite.mjs"; then
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"
            echo "::error::$suite failed twice"
            status=1
          done
          exit $status
      - name: Keep the screenshots and the dev server log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: drawing-${{ matrix.slug }}-screenshots
          path: |
            *.png
            vite.log
          if-no-files-found: ignore

  # The two checks a pull request shows, under the names they always had.
  # Passed when everything under them passed or was not needed, and only then:
  # the change detection must have succeeded, since it decides what is needed,
  # every job under the check must have given a result, and any other word
  # for a result fails it.
  public:
    name: Build and the public map
    needs: [changes, build, public-suite, contribute-suite, preview-suite]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.build.result }} ${{ needs.public-suite.result }} ${{ needs.contribute-suite.result }} ${{ needs.preview-suite.result }}
        run: |
          echo "changes, build, public suites, contributor suites, preview suites: $RESULTS"
          read -ra results <<< "$RESULTS"
          if [ "${#results[@]}" -ne 5 ] || [ "${results[0]}" != success ]; then exit 1; fi
          for result in "${results[@]}"; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done

  studio:
    name: The editor
    needs: [changes, build, studio-suite, drawing]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.build.result }} ${{ needs.studio-suite.result }} ${{ needs.drawing.result }}
        run: |
          echo "changes, build, studio suites, drawing suites: $RESULTS"
          read -ra results <<< "$RESULTS"
          if [ "${#results[@]}" -ne 4 ] || [ "${results[0]}" != success ]; then exit 1; fi
          for result in "${results[@]}"; do
            case "$result" in success | skipped) ;; *) exit 1 ;; esac
          done
