# The own-tiles spike (.scratch/own-tiles/issues/01-spike-build-and-measure.md): builds
# OpenMapTiles-schema vector tiles for the area the published routes reach with Planetiler, measures
# them, and draws the three basemap designs over them beside OpenFreeMap's. Research only: it
# uploads nothing but artifacts and touches neither the live site nor the database.
#
# Ticket 02's monthly build will follow the same steps. Nothing here is a dependency of the app:
# Planetiler is a Java jar fetched at run time, pinned by version and checked against its SHA-256.
name: Tiles spike

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/tiles-spike.yml
      - scripts/research/tiles-*

permissions:
  contents: read

concurrency:
  group: tiles-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  PLANETILER_VERSION: 0.10.2
  PLANETILER_SHA256: f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d
  # Every published route plus 5 km, from `node scripts/research/tiles-bbox.mjs`.
  BBOX: 120.9311,14.4403,121.2225,14.8218

jobs:
  spike:
    name: Build, measure and draw
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      - name: Check the box still covers the published routes
        run: node scripts/research/tiles-bbox.mjs

      - name: Get Planetiler, checked against its checksum
        run: |
          curl -fsSL -o planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/v${PLANETILER_VERSION}/planetiler.jar"
          echo "${PLANETILER_SHA256}  planetiler.jar" | sha256sum -c -

      - name: Get Geofabrik's Philippines extract
        run: |
          curl -fsSL -D extract-headers.txt -o philippines.osm.pbf \
            https://download.geofabrik.de/asia/philippines-latest.osm.pbf
          curl -fsSL -o philippines.osm.pbf.md5 https://download.geofabrik.de/asia/philippines-latest.osm.pbf.md5
          md5sum -c philippines.osm.pbf.md5
          grep -i '^last-modified' extract-headers.txt | tee extract-date.txt
          ls -l philippines.osm.pbf

      - name: Build the tiles with Planetiler
        run: |
          set -o pipefail
          mkdir -p out
          /usr/bin/time -v -o out/time.log \
            java -Xmx8g -jar planetiler.jar \
              --osm-path=philippines.osm.pbf \
              --bounds="${BBOX}" \
              --maxzoom=14 \
              --download \
              --output=out/metro-manila.pmtiles \
              --tmpdir=planetiler-tmp \
              --force 2>&1 | tee out/planetiler.log
          cat out/time.log

      - name: Measure the file and OpenFreeMap's tiles
        run: |
          export EXTRACT="Geofabrik philippines-latest, $(cut -d' ' -f2- extract-date.txt | tr -d '\r')"
          node scripts/research/tiles-measure.mjs out/metro-manila.pmtiles out/summary.json out/time.log

      - run: npx playwright install --with-deps chromium
      - name: Bundle the render page
        run: npx vite build --config scripts/research/tiles-render.vite.config.mjs
      - name: Draw the designs over both sets of tiles
        run: node scripts/research/tiles-render.mjs out/metro-manila.pmtiles out/shots out/summary.json

      - name: Write the summary
        run: node scripts/research/tiles-summary.mjs out/summary.json | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tiles-spike-screenshots
          path: |
            out/shots/
            out/summary.json
            out/planetiler.log
            out/time.log
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: tiles-spike-pmtiles
          path: out/metro-manila.pmtiles
          retention-days: 14
          compression-level: 0
