# Publishes the public map as a file, daily and on demand, and keeps one
# issue open while anything about it needs the owner.
#
# Runs scripts/publish/publish-map.mjs, which reads the public tables with the
# publishable key committed in .env.production and writes public/data/: the
# index the public map reads (index.v5.json, with the trains, the ferry and
# the loops), the indexes older installed apps read (index.v4.json without
# the loops, index.v3.json without the ferry too, index.json without any
# line), a line file per direction, and, for one
# release after the index shipped (2026-09-29), the old single file map.json,
# without any line too.
# Then scripts/checks/check-map-data.mjs reads the indexes back: a problem the app
# could not show honestly (a link to a hotspot that is not there, a route
# whose end hotspot is missing) fails the run before the commit; a warning
# (a line that ends far from its terminal, a hintuan the line passes without
# being linked to it) lets the map go out and is written up for the owner.
# If the file changed, the change is committed to main and the push deploys
# as any other: Cloudflare's GitHub App gets the push like any other. If
# nothing changed, nothing is committed: the script writes a byte-identical
# file for unchanged data.
#
# The push goes over SSH with a repository deploy key (the secret
# PUBLISH_DEPLOY_KEY, write access), because main is protected: pull requests
# only, and the ruleset lets the deploy key, and nothing else, push straight
# to it (docs/agents/main-protection.md). GITHUB_TOKEN cannot be a bypass
# actor and is never a fallback here. A push made with a deploy key, unlike
# one made with GITHUB_TOKEN, starts other workflows: CI skips it through
# `paths-ignore: public/data/**` on its push trigger, and the contributor
# app's release runs on `app-v*` tags only, which this never pushes.
#
# The last step is the loud part. A failed run — the database unreachable, a
# table gone private, a data problem — used to be an email from GitHub that
# nobody reads while the live map went quietly stale. Now the run opens the
# issue "The map needs a look", or brings the open one up to date, with the
# run's log and the data report; the same issue carries the data warnings of
# a run that published. The first run with nothing to report closes it.
#
# The publish script refuses a map that suddenly shrank by more than 30%,
# because a table that answers with no rows is a normal HTTP 200 and a policy
# slip would otherwise blank the public map. When a clear-out is deliberate,
# press "Run workflow" and tick Force.
#
# The daily run also counts as database activity, so the Free project is not
# paused for idleness. GitHub disables schedules in a public repo after 60 days
# without commits; it emails first, and one click re-enables. A quiet map
# makes no commits, so that email will come.
name: Publish map

on:
  schedule:
    # 04:00 in Manila (UTC+8), when nobody is editing.
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if the map shrank or its signboards are gone from the bucket (a deliberate clear-out)'
        type: boolean
        default: false

# Read-only is enough for the repository: the commit is pushed with the deploy
# key, not with this token. The token only keeps the issue.
permissions:
  contents: read
  issues: write

# Never two publishes at once.
concurrency:
  group: publish-map
  cancel-in-progress: false

# `shell: bash` declared, not left to the default: GitHub then runs every
# step as `bash --noprofile --norc -eo pipefail {0}`, so a script piped
# through `tee` fails the step on the script's exit code, not tee's. Without
# it the default is `bash -e {0}`, no pipefail, and a failed publish read as
# success — the last step then closed the issue with "All clear".
defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # First, so a missing key fails the run at once instead of at the push
      # after the whole publish. It writes into publish.log so the issue
      # "The map needs a look" says why.
      - name: Check the deploy key is set
        env:
          PUBLISH_DEPLOY_KEY: ${{ secrets.PUBLISH_DEPLOY_KEY }}
        run: |
          if [ -z "$PUBLISH_DEPLOY_KEY" ]; then
            msg="The secret PUBLISH_DEPLOY_KEY is not set, so the map cannot be pushed to main. Add the deploy key as that repository secret (docs/agents/main-protection.md)."
            echo "::error::$msg"
            echo "$msg" > "$RUNNER_TEMP/publish.log"
            exit 1
          fi

      # Always main, whatever branch "Run workflow" was pressed on: the file
      # is published from, and to, what is live. The deploy key stays in the
      # checkout's git config so the pull and the push below go over SSH.
      - uses: actions/checkout@v5
        with:
          ref: main
          ssh-key: ${{ secrets.PUBLISH_DEPLOY_KEY }}
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Both scripts import the app's own rules from src/, TypeScript, which
      # Node strips; ts-resolve.mjs finds the .ts behind an extensionless
      # import. Since 2026-10-07 the index's shape is a Zod schema the app
      # reads with, the publish validates with and the check reads with
      # (src/features/routes/published), so the runtime dependencies are
      # installed first: zod and the three packages beside it, a few seconds
      # with the cache. The output is kept for the issue; the step fails on
      # the script's exit code through the pipe because the workflow's
      # `shell: bash` (the `defaults` above) sets pipefail.
      #
      # `--force` only on a "Run workflow" press with the box ticked: the
      # schedule has no inputs, so the expression is empty there and the
      # shrink guard keeps its say on every unattended run.
      - name: Install the runtime dependencies
        run: npm ci --omit=dev

      - name: Publish the map
        run: node --experimental-strip-types --import ./scripts/node/ts-resolve.mjs scripts/publish/publish-map.mjs ${{ inputs.force && '--force' || '' }} 2>&1 | tee "$RUNNER_TEMP/publish.log"

      # The check reads the file back against the same rules. The report
      # lands on this run's summary page and in $RUNNER_TEMP/data.md for the
      # issue.
      - name: Check the map data
        run: node --experimental-strip-types --import ./scripts/node/ts-resolve.mjs scripts/checks/check-map-data.mjs --markdown "$RUNNER_TEMP/data.md" 2>&1 | tee "$RUNNER_TEMP/check.log"

      # The indexes older installed apps still read, without the loops
      # (shape 4), the ferry too (shape 3) or any line (shape 2): their
      # problems fail the run too (a route ending at a station would lose its
      # end, a loop in shape 4 would blank every installed app). Their
      # warnings are the new index's, already reported above.
      - name: Check the older indexes
        run: |
          for f in public/data/index.v4.json public/data/index.v3.json public/data/index.json; do
            node --experimental-strip-types --import ./scripts/node/ts-resolve.mjs scripts/checks/check-map-data.mjs "$f" 2>&1 | tee -a "$RUNNER_TEMP/check.log"
          done

      # `git add` first: `git diff` alone cannot see a file git does not track
      # yet, and would report "unchanged" for a brand-new one forever. `-A`
      # for lines/ and signboards/, where the file of a direction gone is
      # removed. The folder whole: signboards/ is empty until a board is
      # uploaded, and git refuses a path that matches nothing.
      - name: Commit if the map changed
        run: |
          git add -A public/data
          if git diff --cached --quiet; then
            echo "The map is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish map $(date -u '+%Y-%m-%d %H:%M UTC')"
          # The owner may have pushed while this ran; go once more behind it.
          # Output into publish.log for the issue. A key that is wrong or has no
          # write access fails here, with git's own message above the hint.
          {
            git pull --rebase origin main || { git rebase --abort; exit 1; }
            git push origin HEAD:main
          } 2>&1 | tee -a "$RUNNER_TEMP/publish.log" || {
            echo "If this is a permission or authentication error: the deploy key PUBLISH_DEPLOY_KEY is missing, wrong, or has no write access (Settings -> Deploy keys)." | tee -a "$RUNNER_TEMP/publish.log"
            exit 1
          }

      # One issue, "The map needs a look", is the whole story. Its body is
      # replaced on every run that has something to say, and a comment is
      # left only when that body changed, so a warning that stands for a
      # month nudges the owner once. Nothing to say closes it.
      - name: Keep the owner told
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout may have happened (a missing key fails before it), so
          # gh cannot read the repository from a clone.
          GH_REPO: ${{ github.repository }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The map needs a look"
          now="$(date -u '+%Y-%m-%d %H:%M UTC')"
          body=""
          if [ "$STATUS" != "success" ]; then
            body+="**The publish on $now did not go through** ($STATUS): [the run]($RUN_URL)."$'\n\n'
            if [ ! -f "$RUNNER_TEMP/publish.log" ]; then
              body+="The run stopped before the publish started. If it was the checkout, the deploy key PUBLISH_DEPLOY_KEY is missing, wrong, or has no write access (Settings -> Deploy keys)."$'\n\n'
            fi
            log="$(tail -q -n 15 "$RUNNER_TEMP/publish.log" "$RUNNER_TEMP/check.log" 2>/dev/null | sed '/ExperimentalWarning/d' || true)"
            if [ -n "$log" ]; then body+='```'$'\n'"$log"$'\n''```'$'\n\n'; fi
          fi
          if [ -f "$RUNNER_TEMP/data.md" ] && ! grep -q 'Nothing to report' "$RUNNER_TEMP/data.md"; then
            body+="$(cat "$RUNNER_TEMP/data.md")"$'\n\n'
          fi
          number="$(gh issue list --state open --limit 50 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)"
          if [ -z "$body" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "All clear: the publish on $now had nothing to report ([the run]($RUN_URL))."
            fi
            echo "Nothing to report."
            exit 0
          fi
          body+="_Kept by the Publish map workflow (.github/workflows/publish-map.yml); it closes on the first run with nothing to report._"
          if [ -z "$number" ]; then
            gh issue create --title "$title" --body "$body"
          elif [ "$(gh issue view "$number" --json body --jq .body)" != "$body" ]; then
            gh issue edit "$number" --body "$body"
            gh issue comment "$number" --body "Brought up to date by [the run]($RUN_URL) on $now."
          else
            echo "The open issue already says this."
          fi
