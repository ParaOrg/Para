# The weekly backup of the contributions and the route tables: a pg_dump,
# compressed, encrypted to the owner's public key and uploaded to a private
# Cloudflare R2 bucket. Free Supabase has no downloadable backups, and a ride
# cannot be recorded again. Ticket contribute/15, .scratch/contribute/database.md
# section 7.
#
# The repo is public, and so are its logs. The run therefore prints sizes and
# counts only, uploads no GitHub artifact and opens no issue. The dump is
# piped through gzip and gpg and never touches the disk unencrypted. The
# private key is never on GitHub: only the public one is, in
# .github/backup/owner-public-key.asc.
#
# Covers: contributor, contribution, point_batch (and its monthly pieces),
# hinto, contribution_use, route, route_variant, stop, route_stop, draft,
# takedown, gps_session. Not private.editor, not editor_name.
#
# ---------------------------------------------------------------------------
# THE OWNER'S SETUP, in this order (nothing below has been done yet)
# ---------------------------------------------------------------------------
#  1. R2 bucket. Cloudflare dashboard -> R2 -> Create bucket (private, never
#     turn on the public URL or a custom domain). Then Settings -> Object
#     lifecycle rules -> Add rule: delete objects 60 days after they were
#     created, applied to the whole bucket. The consent screen promises 60 days.
#  2. R2 token. R2 -> Manage API tokens -> Create API token, permission
#     "Object Read & Write", scoped to THAT bucket only (not the account).
#     Keep the Access Key ID, the Secret Access Key and the account's S3
#     endpoint, https://<account-id>.r2.cloudflarestorage.com.
#  3. GPG key pair, on your own computer (not a CI runner, not this repo):
#       gpg --quick-generate-key "ParaPo backup <you@example.com>" ed25519 encr 5y
#       gpg --armor --export "ParaPo backup" > owner-public-key.asc
#     Commit owner-public-key.asc as .github/backup/owner-public-key.asc (a
#     public key is safe in a public repo). Keep the PRIVATE key
#     (gpg --armor --export-secret-keys "ParaPo backup") in your password
#     manager and on an offline copy. Never on GitHub, never in R2, never in
#     Supabase: with it gone every backup is unreadable.
#  4. The role. Apply supabase/migrations/20261022100000_backup_reader.sql in
#     the SQL editor (after 20261022090000_contribution_use.sql, so
#     contribution_use is covered), as postgres, then set the password:
#       alter role backup_reader with password '<a long random password>';
#     After each `select private.add_months(12);` run
#     `select private.grant_backup_reader();`, or the next backup fails on the
#     new monthly piece.
#  5. GitHub secrets (Settings -> Secrets and variables -> Actions, repository
#     secrets). The exact names this workflow reads:
#       BACKUP_DATABASE_URL    postgresql://backup_reader.<project-ref>:<password>@<pooler-host>:5432/postgres
#                              (the session pooler's string, port 5432: pg_dump
#                              needs a session, not the transaction pooler on
#                              6543. Percent-encode the password's special
#                              characters.)
#       R2_ENDPOINT            https://<account-id>.r2.cloudflarestorage.com
#       R2_ACCESS_KEY_ID       from step 2
#       R2_SECRET_ACCESS_KEY   from step 2
#       R2_BUCKET              the bucket's name
#  6. Check that the pooler accepts the role, from your computer:
#       psql "$BACKUP_DATABASE_URL" -Atc "select current_user, count(*) from public.route"
#     It must print backup_reader and a number. If the pooler refuses the
#     login, use the direct connection string (Settings -> Database) instead,
#     over IPv4 add-on or from an IPv6 network, and say so in the ticket.
#  7. One manual run: Actions -> Backup -> Run workflow. It must end green,
#     the log must show only sizes and counts, and the bucket must hold one
#     parapo-<date>.sql.gz.gpg file. Then try the restore below once.
#
# ---------------------------------------------------------------------------
# RESTORE, into a local Postgres (try it once at setup; note how long it took)
# ---------------------------------------------------------------------------
#  1. Download the newest file from the bucket (dashboard, or with the aws CLI
#     and the same R2 values: aws s3 cp --endpoint-url "$R2_ENDPOINT"
#     s3://<bucket>/parapo-<date>.sql.gz.gpg .).
#  2. Decrypt with the private key (gpg asks for its passphrase) and unpack:
#       gpg --decrypt parapo-<date>.sql.gz.gpg | gunzip > parapo.sql
#  3. A scratch Postgres (the project's major version, see PG_MAJOR below):
#       docker run --rm -d --name parapo-restore -e POSTGRES_PASSWORD=x -p 5433:5432 postgres:17
#  4. Stand in for what the dump points at outside itself, then load it. Row
#     security policies and triggers that call Supabase's own functions fail
#     to create, which is expected; the tables and every row still load:
#       export PGPASSWORD=x
#       psql -h localhost -p 5433 -U postgres -c 'create database parapo'
#       psql -h localhost -p 5433 -U postgres -d parapo <<'SQL'
#       create schema auth;
#       create table auth.users (id uuid primary key);
#       create function auth.uid() returns uuid language sql as 'select null::uuid';
#       create role anon; create role authenticated;
#       SQL
#       psql -h localhost -p 5433 -U postgres -d parapo -f parapo.sql
#     (Rows of auth.users are not in the backup; add the foreign keys back only
#     if you need them.)
#  5. Compare: select count(*) from public.contribution; and so on.
#  6. Delete parapo.sql and stop the container: it is plain text.
name: Backup

on:
  schedule:
    # Sunday 02:00 in Manila (UTC+8), after the map's nightly publish and
    # before anyone is editing.
    - cron: '0 18 * * 6'
  workflow_dispatch:

permissions:
  contents: read

# Never two backups at once.
concurrency:
  group: backup
  cancel-in-progress: false

# `shell: bash` declared so every step runs with pipefail (see publish-map.yml).
defaults:
  run:
    shell: bash

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Must be at least the database's major version: pg_dump refuses a newer server.
      PG_MAJOR: '17'
      PUBLIC_KEY_FILE: .github/backup/owner-public-key.asc
    steps:
      - uses: actions/checkout@v5

      - name: Check the public key and the secrets
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if ! grep -q 'BEGIN PGP PUBLIC KEY BLOCK' "$PUBLIC_KEY_FILE" 2>/dev/null; then
            echo "::error::$PUBLIC_KEY_FILE is missing or is not an armored public key. Commit the owner's public key there (setup step 3 in this file's header). The backup will not run unencrypted."
            exit 1
          fi
          missing=0
          for name in BACKUP_DATABASE_URL R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::The GitHub secret $name is not set (setup step 5 in this file's header)."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install the PostgreSQL client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends "postgresql-client-$PG_MAJOR"
          "/usr/lib/postgresql/$PG_MAJOR/bin/pg_dump" --version

      - name: Dump, compress, encrypt, upload
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -u
          pg_bin="/usr/lib/postgresql/$PG_MAJOR/bin"
          out="$RUNNER_TEMP/parapo-$(date -u +%Y%m%d-%H%M%S).sql.gz.gpg"

          # A throwaway keyring holding only the public key.
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import "$PUBLIC_KEY_FILE"
          recipient="$(gpg --batch --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ -z "$recipient" ]; then
            echo "::error::No key could be read from $PUBLIC_KEY_FILE."
            exit 1
          fi

          # --enable-row-security: by default pg_dump turns row security off and
          # errors for a role without BYPASSRLS; backup_reader's read policies
          # (the migration) then return every row.
          # point_batch* takes the parent, every monthly piece and the default:
          # the data lives in the pieces.
          "$pg_bin/pg_dump" "$BACKUP_DATABASE_URL" \
            --no-owner --no-privileges --no-comments --enable-row-security \
            --table='public.contributor' --table='public.contribution' \
            --table='public.point_batch*' --table='public.hinto' \
            --table='public.contribution_use' \
            --table='public.route' --table='public.route_variant' \
            --table='public.stop' --table='public.route_stop' \
            --table='public.draft' --table='public.takedown' \
            --table='public.gps_session' \
            | gzip -9 \
            | gpg --batch --yes --trust-model always --recipient "$recipient" --output "$out" --encrypt

          size="$(stat -c %s "$out")"
          echo "Encrypted dump: $size bytes"
          # An empty database still gives a few KB of schema; less means the dump failed.
          if [ "$size" -lt 2048 ]; then
            echo "::error::The encrypted dump is only $size bytes. Not uploading it."
            exit 1
          fi

          key="$(basename "$out")"
          aws s3 cp "$out" "s3://$R2_BUCKET/$key" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          uploaded="$(aws s3api head-object --bucket "$R2_BUCKET" --key "$key" \
            --endpoint-url "$R2_ENDPOINT" --query ContentLength --output text)"
          echo "Uploaded $key: $uploaded bytes"
          if [ "$uploaded" != "$size" ]; then
            echo "::error::The bucket holds $uploaded bytes, the local file $size."
            exit 1
          fi

          # Counts only, never rows.
          for table in contributor contribution hinto contribution_use route route_variant stop route_stop; do
            count="$("$pg_bin/psql" "$BACKUP_DATABASE_URL" -Atc "select count(*) from public.$table")"
            echo "$table: $count rows"
          done
          count="$("$pg_bin/psql" "$BACKUP_DATABASE_URL" -Atc "select coalesce(sum(point_count), 0) from public.point_batch")"
          echo "point_batch: $count points"
