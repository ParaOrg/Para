# Builds the contributor app, the Android APK (docs/adr/0006, .scratch/contributor-app/).
#
#   - A pull request that touches the app, a push to `staging` that does, or "Run workflow", builds
#     a DEBUG APK and attaches it as an artifact. These jobs never see a secret.
#   - On `staging`, once that APK's emulator checks pass, `test-latest` puts it on the pre-release
#     tagged test-latest as para-test.apk, replacing the last one, so
#     releases/download/test-latest/para-test.apk is always the newest test build. A pre-release is
#     never the "latest" Release, so the app's update check (releases/latest/download/latest.json)
#     never sees it.
#   - A tag `app-v*` (app-v1.2.3) runs three jobs. `build-release` builds the RELEASE APK, signs it,
#     and checks the signature against the key's recorded fingerprint. `publish` creates a GitHub
#     Release with two assets, para-contributor.apk and latest.json (the app's update check reads
#     it). The tag sets the version.
#   - A release with no key fails; it never produces an unsigned APK. Locally, and in pull
#     requests, a release build is unsigned.
#
# The key: android/release-key.p12.enc, made once by "Make the app signing key"
# (make-app-signing-key.yml), is decrypted here with the secret PARAPO_KEY_PASSPHRASE into a temp
# file that the last step deletes. The repository is public, so the passphrase is all that protects
# the key. Lose the key and testers must uninstall to update.
#
# The secret lives in the GitHub Environment `app-release`, which the owner restricts to the tags
# `app-v*` and the branch `main`: no pull request, branch or other tag can read it. Only
# `build-release` (and the key-making workflow) names that environment. Only `publish` can write to
# the repository, and it has no secret and builds nothing.
#
# The runner's own Android SDK is used: android-actions/setup-android failed on it.
name: Contributor app

on:
  push:
    tags: ['app-v*']
    # The newest test build (test-latest, below). GitHub reads no paths for a tag's push, so the
    # release tags still run whatever they change.
    branches: [staging]
    paths:
      - '.github/workflows/contributor-app.yml'
      - '.github/actions/prepare-app-build/**'
      - '.github/actions/prepare-emulator/**'
      - 'android/**'
      - 'scripts/android/**'
      - 'scripts/apk/**'
      - 'scripts/publish/app-release*'
      - 'capacitor.config.ts'
      - 'vite.apk.config.ts'
      - '.env.apk'
      - 'contribute/**'
      - 'src/app/contribute/**'
      - 'src/features/contribute/**'
      - 'src/features/locator/**'
      - 'src/features/routes/**'
      - 'src/shared/**'
      - 'src/design-system/**'
      - 'src/styles/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.github/workflows/contributor-app.yml'
      - '.github/actions/prepare-app-build/**'
      - '.github/actions/prepare-emulator/**'
      - 'android/**'
      - 'scripts/android/**'
      - 'scripts/apk/**'
      - 'scripts/publish/app-release*'
      - 'capacitor.config.ts'
      - 'vite.apk.config.ts'
      - '.env.apk'
      - 'contribute/**'
      - 'src/app/contribute/**'
      - 'src/features/contribute/**'
      - 'src/features/locator/**'
      - 'src/features/routes/**'
      - 'src/shared/**'
      - 'src/design-system/**'
      - 'src/styles/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

# On a pull request a newer push cancels the run for the older one. On main and staging, and
# for a release tag, a run that has started is never cancelled (as in ci.yml): the commit it
# checks gets its full verdict.
concurrency:
  group: contributor-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# `shell: bash` declared, not left to the default: GitHub then runs every step as
# `bash --noprofile --norc -eo pipefail {0}`, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

# The emulator jobs' system image, given both to prepare-emulator and to android-emulator-runner.
env:
  EMULATOR_API_LEVEL: 34
  EMULATOR_TARGET: google_apis
  EMULATOR_ARCH: x86_64

jobs:
  debug:
    name: apk
    if: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-app-build

      - name: Build the contributor page for the app
        run: npx vite build -c vite.apk.config.ts --mode apk

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # The ride's rules (android/app/src/main/java/ph/para/contributor/ride/), on the JVM: every
      # state and outside event in docs/architecture/state-machines.md that has a rule.
      - name: Test the ride's rules (JUnit)
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: para-contributor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # The screen-off ride on an emulator (scripts/apk/emulator-ride.sh): twenty minutes with the screen
  # off, the app's process killed at fifteen, and every fix up to the kill still in the ride. Its APK
  # is built with the ride's driver (VITE_EMULATOR_RIDE), so it is not the APK a tester installs.
  emulator-ride:
    if: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-app-build

      - name: Build the page with the ride's driver, and the debug APK
        env:
          VITE_EMULATOR_RIDE: '1'
        run: |
          npx vite build -c vite.apk.config.ts --mode apk
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installs the emulator and its image with retries, and stops the job with "Emulator setup
      # failed, no test ran" when it can't, rather than letting adb fail to connect later.
      - uses: ./.github/actions/prepare-emulator
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}

      - name: Ride with the screen off
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/apk/emulator-ride.sh android/app/build/outputs/apk/debug/app-debug.apk emulator-out

      - name: Show the result
        if: always()
        run: |
          # The ride's script makes this folder first: without it, no test ran.
          if [ ! -d emulator-out ]; then
            echo "::error title=Emulator setup failed::Emulator setup failed, no test ran: the emulator never came up. See the steps above."
          fi
          cat emulator-out/summary.txt | tee -a "$GITHUB_STEP_SUMMARY" || true
          grep -a "PARA_RIDE" emulator-out/logcat.txt | tail -40 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-ride
          path: emulator-out
          if-no-files-found: warn
          retention-days: 14

  # The ride notification's taps on an emulator (scripts/apk/emulator-notification.sh): Lakad or
  # Sakay, Pause, Resume and Finish, done natively with the page leaving them, as a page asleep
  # does; and the ride's service in the foreground, or not, after each, as RideActionReceiver stops
  # and starts it (RideService.java). The emulator ride's APK, with its driver.
  emulator-notification:
    if: ${{ !startsWith(github.ref, 'refs/tags/app-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-app-build

      - name: Build the page with the ride's driver, and the debug APK
        env:
          VITE_EMULATOR_RIDE: '1'
        run: |
          npx vite build -c vite.apk.config.ts --mode apk
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installs the emulator and its image with retries, and stops the job with "Emulator setup
      # failed, no test ran" when it can't, rather than letting adb fail to connect later.
      - uses: ./.github/actions/prepare-emulator
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}

      - name: Tap the ride's notification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/apk/emulator-notification.sh android/app/build/outputs/apk/debug/app-debug.apk notification-out

      - name: Show the result
        if: always()
        run: |
          # The script makes this folder first: without it, no test ran.
          if [ ! -d notification-out ]; then
            echo "::error title=Emulator setup failed::Emulator setup failed, no test ran: the emulator never came up. See the steps above."
          fi
          cat notification-out/summary.txt | tee -a "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: emulator-notification
          path: notification-out
          if-no-files-found: warn
          retention-days: 14

  # The newest test build from staging, at one address that never changes:
  # releases/download/test-latest/para-test.apk. The `apk` job's debug APK ("Para (test)", installed
  # beside the real app), put on the pre-release test-latest once its emulator checks have passed,
  # replacing the last one, with the tag moved to the commit it was built from. A pre-release is
  # never the "latest" Release, so the app's update check (releases/latest/download/latest.json)
  # never offers it. Only GITHUB_TOKEN, with contents: write for this job alone.
  test-latest:
    if: ${{ github.ref == 'refs/heads/staging' }}
    needs: [debug, emulator-ride, emulator-notification]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: para-contributor-debug
          path: apk

      - name: Put it on the test-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/app-debug.apk para-test.apk
          notes="The newest test build from staging, built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d). It installs beside Para as Para (test). Not a release: the app never offers it as an update."
          if gh release view test-latest > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/test-latest" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release upload test-latest para-test.apk --clobber
            gh release edit test-latest --prerelease --latest=false --notes "$notes"
          else
            gh release create test-latest para-test.apk --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Para (test): newest from staging" --notes "$notes"
          fi

  build-release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: app-release
    env:
      # The key and its secret keep the product's old name: the key was made with them.
      PARAPO_KEY_ALIAS: parapo
    steps:
      - uses: actions/checkout@v7

      # Before anything is built or the key is read: the tag is on main, CI passed for its commit,
      # and its version is one step after the last release (scripts/publish/release-guard.mjs).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the tag is a release that may go out
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --import ./scripts/node/ts-resolve.mjs scripts/publish/release-guard.mjs

      # The secret is named only in the steps that use it. A release with no key stops here,
      # before anything is built.
      - name: Check the signing key is there
        env:
          PARAPO_KEY_PASSPHRASE: ${{ secrets.PARAPO_KEY_PASSPHRASE }}
        run: |
          if [[ -z "$PARAPO_KEY_PASSPHRASE" ]]; then
            echo "::error::Not publishing an unsigned APK. The secret PARAPO_KEY_PASSPHRASE is missing from the app-release environment."
            exit 1
          fi
          for file in android/release-key.p12.enc android/release-key.sha256; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Not publishing an unsigned APK. $file is missing: run \"Make the app signing key\" first."
              exit 1
            fi
          done

      - uses: ./.github/actions/prepare-app-build

      # app-v1.2.3 gives versionName 1.2.3 and versionCode 1002003 (major * 1,000,000 +
      # minor * 1,000 + patch), so a newer tag is always a higher code. The major stops at 2100
      # and the minor and patch at 999, which keeps the code under Android's limit of 2,147,483,647
      # (src/features/contribute/app-update/version-code.ts holds the same rule).
      - name: Read the version
        run: |
          version="${GITHUB_REF_NAME#app-v}"
          if [[ ! "$version" =~ ^([0-9]{1,4})\.([0-9]{1,3})\.([0-9]{1,3})$ ]] || (( 10#${BASH_REMATCH[1]} > 2100 )); then
            echo "::error::The tag $GITHUB_REF_NAME is not app-v<major up to 2100>.<minor up to 999>.<patch up to 999>."
            exit 1
          fi
          code=$(( 10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]} ))
          echo "GRADLE_VERSION=-PappVersionName=$version -PappVersionCode=$code" >> "$GITHUB_ENV"
          echo "APK_NAME=para-contributor-$version" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          # The page reads its own version code to compare with latest.json (api/env.ts).
          echo "VITE_APP_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Build the contributor page for the app
        run: npx vite build -c vite.apk.config.ts --mode apk

      - name: Check the page carries no test driver
        run: |
          if grep -rl "PARA_RIDE" dist-apk; then
            echo "::error::The release page holds the emulator ride's driver."
            exit 1
          fi

      - name: Copy it into the Android project
        run: npx cap sync android

      # The keystore only ever exists as this temp file; the last step deletes it.
      - name: Decrypt the keystore
        env:
          PARAPO_KEY_PASSPHRASE: ${{ secrets.PARAPO_KEY_PASSPHRASE }}
        run: |
          keystore="$RUNNER_TEMP/para-release.p12"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 600000 \
            -pass env:PARAPO_KEY_PASSPHRASE -in android/release-key.p12.enc -out "$keystore"
          echo "PARAPO_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # Gradle reads the keystore password from its environment; the passphrase itself is dropped
      # before Gradle (and the build scripts and plugins it runs) starts.
      - name: Build the release APK (signed)
        working-directory: android
        env:
          PARAPO_KEY_PASSPHRASE: ${{ secrets.PARAPO_KEY_PASSPHRASE }}
        run: |
          PARAPO_KEYSTORE_PASSWORD="$(../scripts/android/store-password.sh)"
          echo "::add-mask::$PARAPO_KEYSTORE_PASSWORD"
          unset PARAPO_KEY_PASSPHRASE
          export PARAPO_KEYSTORE_PASSWORD
          export PARAPO_KEY_PASSWORD="$PARAPO_KEYSTORE_PASSWORD"
          ./gradlew assembleRelease --no-daemon $GRADLE_VERSION

      # Gradle falls back to an unsigned APK when it cannot sign; a missing file, a failed verify
      # or a certificate that is not the recorded key's stops the release.
      - name: Check the APK is signed with our key
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$apk" ]]; then
            echo "::error::No signed APK was built."
            exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$apksigner" verify "$apk"
          certs="$("$apksigner" verify --print-certs "$apk")"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' <<< "$certs")"
          expected="$(tr -d '[:space:]' < android/release-key.sha256)"
          if [[ -z "$actual" || "$actual" != "$expected" ]]; then
            echo "::error::The APK is not signed with the recorded key (certificate SHA-256 $actual, expected $expected)."
            exit 1
          fi

      - name: Lay out the release files
        run: |
          node --experimental-strip-types --import ./scripts/node/ts-resolve.mjs \
            scripts/publish/app-release.mjs \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --version "$APP_VERSION" --code "$APP_VERSION_CODE" \
            --min "$(tr -d '[:space:]' < android/min-version.txt)" \
            --apk-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/para-contributor.apk" \
            --out app-publish

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: app-publish
          if-no-files-found: error
          retention-days: 90

      - name: Delete the keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/para-release.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/para-release.p12"

  # The only job that can write to the repository. It has no secret and builds nothing: it
  # publishes what `build-release` signed. `releases/latest/download/latest.json` (what the app
  # reads) always names the newest Release, so any other Release must be made with --latest=false.
  publish:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: para-contributor-*
          merge-multiple: true
          path: release-files

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The owner usually makes the tag through GitHub's "Draft a new release" page, which
        # creates the Release with the tag; a tag pushed on its own has none yet. Fill whichever.
        run: |
          files=(release-files/para-contributor.apk release-files/latest.json)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --latest --prerelease=false --draft=false
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag --latest --prerelease=false \
              --title "Para Contributor ${GITHUB_REF_NAME#app-v}" \
              --notes "Install over the previous version to keep your recordings."
          fi
