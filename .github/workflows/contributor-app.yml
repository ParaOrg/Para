# Builds the contributor app, the Android APK (docs/adr/0006, .scratch/contributor-app/).
#
#   - A pull request that touches the app builds a DEBUG APK and attaches it as an artifact.
#   - A tag `app-v*` (app-v1.2.3) builds a RELEASE APK, signs it, checks the signature, and the
#     `release` job publishes a GitHub Release with two assets: parapo-contributor.apk and
#     latest.json (the app's update check reads it). The tag sets the version.
#   - "Run workflow" builds a debug APK from any branch; with `release` ticked it builds and signs
#     the release APK the same way, with the version name and code typed in, and attaches it as an
#     artifact but publishes no Release.
#   - A release run with no key fails; it never produces an unsigned APK. Pull requests never see
#     the secrets: their release build, locally too, is unsigned.
#
# The key: android/release-key.p12.enc, made once by "Make the app signing key"
# (make-app-signing-key.yml), is decrypted here with the one repository secret
# PARAPO_KEY_PASSPHRASE into a temp file that the last step deletes. The repository is public, so
# the passphrase is all that protects the key. Lose the key and testers must uninstall to update.
#
# The runner's own Android SDK is used: android-actions/setup-android failed on it.
name: Contributor app

on:
  push:
    tags: ['app-v*']
  pull_request:
    paths:
      - '.github/workflows/contributor-app.yml'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.apk.config.ts'
      - '.env.apk'
      - 'contribute/**'
      - 'src/app/contribute/**'
      - 'src/features/contribute/**'
      - 'src/features/locator/**'
      - 'src/features/routes/**'
      - 'src/shared/**'
      - 'src/design-system/**'
      - 'src/styles/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      release:
        description: Build the signed release APK, as a tag does (no GitHub Release)
        type: boolean
        default: false
      version_name:
        description: Release only, the version name, such as 1.2.3
        default: 0.0.0-dev
      version_code:
        description: Release only, the version code, such as 1002003
        default: '1'

concurrency:
  group: contributor-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/app-v') || inputs.release == true }}
      PARAPO_KEY_ALIAS: parapo
    steps:
      - uses: actions/checkout@v5

      # A release with no key stops here, before anything is built.
      - name: Check the signing key is there
        if: env.IS_RELEASE == 'true'
        env:
          PARAPO_KEY_PASSPHRASE: ${{ secrets.PARAPO_KEY_PASSPHRASE }}
        run: |
          if [[ -z "$PARAPO_KEY_PASSPHRASE" ]]; then
            echo "::error::Not publishing an unsigned APK. The repository secret PARAPO_KEY_PASSPHRASE is missing."
            exit 1
          fi
          if [[ ! -f android/release-key.p12.enc ]]; then
            echo "::error::Not publishing an unsigned APK. android/release-key.p12.enc is missing: run \"Make the app signing key\" first."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image carries the SDK; make sure the platform and build tools Capacitor 8
      # asks for are there.
      - name: Install the Android platform and build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # app-v1.2.3 gives versionName 1.2.3 and versionCode 1002003 (major * 1,000,000 +
      # minor * 1,000 + patch), so a newer tag is always a higher code. A manual release run
      # takes both from its inputs.
      - name: Read the version
        if: env.IS_RELEASE == 'true'
        env:
          INPUT_NAME: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/app-v* ]]; then
            version="${GITHUB_REF_NAME#app-v}"
            if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::The tag $GITHUB_REF_NAME is not app-v<major>.<minor>.<patch>."
              exit 1
            fi
            code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          else
            version="$INPUT_NAME"
            code="$INPUT_CODE"
            if [[ ! "$version" =~ ^[0-9A-Za-z._-]+$ || ! "$code" =~ ^[0-9]+$ ]]; then
              echo "::error::Give a version name (letters, digits, . _ -) and a numeric version code."
              exit 1
            fi
          fi
          echo "GRADLE_VERSION=-PappVersionName=$version -PappVersionCode=$code" >> "$GITHUB_ENV"
          echo "APK_NAME=parapo-contributor-$version" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$code" >> "$GITHUB_ENV"
          # The page reads its own version code to compare with latest.json (api/env.ts).
          echo "VITE_APP_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Build the contributor page for the app
        run: npx vite build -c vite.apk.config.ts --mode apk

      - name: Copy it into the Android project
        run: npx cap sync android

      - name: Build the debug APK
        if: env.IS_RELEASE != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # The keystore only ever exists as this temp file; the last step deletes it. The secret is
      # masked in the log and never echoed.
      - name: Decrypt the keystore
        if: env.IS_RELEASE == 'true'
        env:
          PARAPO_KEY_PASSPHRASE: ${{ secrets.PARAPO_KEY_PASSPHRASE }}
        run: |
          keystore="$RUNNER_TEMP/parapo-release.p12"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:PARAPO_KEY_PASSPHRASE -in android/release-key.p12.enc -out "$keystore"
          echo "PARAPO_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build the release APK (signed)
        if: env.IS_RELEASE == 'true'
        working-directory: android
        env:
          PARAPO_KEY_PASSPHRASE: ${{ secrets.PARAPO_KEY_PASSPHRASE }}
        run: |
          PARAPO_KEYSTORE_PASSWORD="$(../scripts/android/store-password.sh)"
          export PARAPO_KEYSTORE_PASSWORD
          export PARAPO_KEY_PASSWORD="$PARAPO_KEYSTORE_PASSWORD"
          ./gradlew assembleRelease --no-daemon $GRADLE_VERSION

      # Gradle falls back to an unsigned APK when it cannot sign; that file name, or a failed
      # verify, stops the release.
      - name: Check the APK is signed
        if: env.IS_RELEASE == 'true'
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [[ ! -f "$apk" ]]; then
            echo "::error::No signed APK was built."
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk" | head -5

      - name: Lay out the release files
        if: env.IS_RELEASE == 'true'
        run: |
          node --experimental-strip-types --import ./scripts/node/ts-resolve.mjs \
            scripts/publish/app-release.mjs \
            --apk android/app/build/outputs/apk/release/app-release.apk \
            --version "$APP_VERSION" --code "$APP_VERSION_CODE" \
            --min "$(tr -d '[:space:]' < android/min-version.txt)" \
            --apk-url "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/parapo-contributor.apk" \
            --out app-publish

      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE != 'true'
        with:
          name: parapo-contributor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: env.IS_RELEASE == 'true'
        with:
          name: ${{ env.APK_NAME }}
          path: app-publish
          if-no-files-found: error
          retention-days: 90

      - name: Delete the keystore
        if: always() && env.IS_RELEASE == 'true'
        run: shred -u "$RUNNER_TEMP/parapo-release.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/parapo-release.p12"

  # The only job that can write to the repository, and only on a tag. It publishes what the signed
  # build made; it builds nothing. `releases/latest/download/...` then always names the newest.
  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: parapo-contributor-*
          merge-multiple: true
          path: release-files

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-files/parapo-contributor.apk release-files/latest.json \
            --verify-tag --latest --prerelease=false \
            --title "ParaPo Contributor ${GITHUB_REF_NAME#app-v}" \
            --notes "Install over the previous version to keep your recordings."
