# The monthly build of Para's own map tiles (.scratch/own-tiles/spec.md, ticket 02): Planetiler's
# OpenMapTiles profile over Geofabrik's Philippines extract, clipped to the box the public map can
# be panned across (METRO_MANILA in map-view.tsx), zoom 0-14, as one PMTiles file. Checked, then
# uploaded to a private-by-default R2 bucket with the basemap's sprite, glyphs and styles.
#
# A pull request builds and checks but uploads nothing. Upload runs only from `staging` or `main`:
# on a push to staging that changes this workflow or scripts/tiles/, on the monthly schedule and on
# "Run workflow" with `upload` ticked. GitHub runs `schedule` only from the default branch and shows
# "Run workflow" only for a workflow file on it, so until staging is released to main the push to
# staging is the only way an upload starts. A failure is a red run with an ::error:: line: GitHub
# emails the owner about a failed scheduled run, the way backup.yml is reported (no issue, no artifact).
#
# THE OWNER'S SETUP: an R2 bucket and an API token ("Object Read & Write", scoped to that bucket),
# then a GitHub Environment named `tiles` (Settings -> Environments), with deployment branches
# limited to `staging` and `main`, holding these four secrets (environment secrets, not repository
# secrets, so GitHub itself keeps the keys from any other branch's copy of this file):
#   TILES_R2_ENDPOINT           https://<account-id>.r2.cloudflarestorage.com
#   TILES_R2_ACCESS_KEY_ID      the token's Access Key ID
#   TILES_R2_SECRET_ACCESS_KEY  the token's Secret Access Key
#   TILES_R2_BUCKET             the bucket's name
# An upload run with a secret missing stops at its first step and says which. Only the steps that
# talk to R2 carry the keys.
#
# Nothing here is a dependency of the app: Planetiler is a Java jar fetched at run time, pinned by
# version and checked against its SHA-256; the AWS CLI is preinstalled on ubuntu-latest.
name: Tiles

on:
  schedule:
    # The 3rd of each month, 18:00 UTC = 02:00 in Manila, after Geofabrik's first-of-month extracts.
    - cron: '0 18 3 * *'
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the checked build to R2 (a pull request never does)
        type: boolean
        default: false
  push:
    branches: [staging]
    paths:
      - .github/workflows/tiles.yml
      - scripts/tiles/**
  pull_request:
    paths:
      - .github/workflows/tiles.yml
      - scripts/tiles/**

permissions:
  contents: read

# Never two uploads at once; a newer push to a pull request replaces its older run.
concurrency:
  group: tiles-${{ github.event_name == 'pull_request' && github.ref || 'upload' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  PLANETILER_VERSION: 0.10.2
  PLANETILER_SHA256: f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d

jobs:
  tiles:
    name: Build, check and upload
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The branch rule on the environment is what keeps the keys from a pull request or any other
    # branch; a pull request uses no environment and so sees no secrets.
    environment: ${{ github.event_name != 'pull_request' && 'tiles' || '' }}
    env:
      SHOULD_UPLOAD: ${{ github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: echo "WORK=$RUNNER_TEMP/tiles" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check the upload may run
        if: env.SHOULD_UPLOAD == 'true'
        env:
          TILES_R2_ENDPOINT: ${{ secrets.TILES_R2_ENDPOINT }}
          TILES_R2_ACCESS_KEY_ID: ${{ secrets.TILES_R2_ACCESS_KEY_ID }}
          TILES_R2_SECRET_ACCESS_KEY: ${{ secrets.TILES_R2_SECRET_ACCESS_KEY }}
          TILES_R2_BUCKET: ${{ secrets.TILES_R2_BUCKET }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/staging ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::The tiles are uploaded only from staging or main; this run is on $GITHUB_REF_NAME. Untick 'upload' to build and check only."
            exit 1
          fi
          missing=0
          for name in TILES_R2_ENDPOINT TILES_R2_ACCESS_KEY_ID TILES_R2_SECRET_ACCESS_KEY TILES_R2_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "::error::The secret $name is not set in the 'tiles' environment (see this file's header). Nothing was built or uploaded."
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          # The value is never printed. Whitespace is an error rather than trimmed: the later steps
          # pass the secret to aws as it is.
          endpoint_pattern='^https://[0-9a-f]{32}(\.(eu|fedramp))?\.r2\.cloudflarestorage\.com$'
          if ! [[ "$TILES_R2_ENDPOINT" =~ $endpoint_pattern ]]; then
            echo "::error::TILES_R2_ENDPOINT is not an R2 endpoint. It must be exactly https://<32-character account id>.r2.cloudflarestorage.com (or .eu. / .fedramp. before r2), with no path, quotes, spaces or line break. Nothing was built or uploaded."
            exit 1
          fi

      - name: Read the box and check it covers every published route
        id: area
        run: |
          bounds="$(node scripts/tiles/area.mjs)"
          echo "bounds=$bounds" >> "$GITHUB_OUTPUT"

      # Planetiler's own downloads come from three third-party hosts. An upload run keeps a copy in
      # R2 (sources.sh); a pull request, which does not read R2, uses GitHub's cache (dropped after
      # 7 days unused) and then upstream.
      - uses: actions/cache@v4
        with:
          path: ${{ env.WORK }}/data/sources
          key: planetiler-sources-${{ env.PLANETILER_VERSION }}

      - name: Get what the last build left in R2
        if: env.SHOULD_UPLOAD == 'true'
        env:
          TILES_R2_ENDPOINT: ${{ secrets.TILES_R2_ENDPOINT }}
          TILES_R2_BUCKET: ${{ secrets.TILES_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TILES_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          scripts/tiles/sources.sh pull "$WORK/data/sources"
          found="$(aws s3api list-objects-v2 --endpoint-url "$TILES_R2_ENDPOINT" --bucket "$TILES_R2_BUCKET" \
            --prefix tiles/current.json --query 'Contents[0].Key' --output text)"
          if [ "$found" = "tiles/current.json" ]; then
            aws s3 cp "s3://$TILES_R2_BUCKET/tiles/current.json" "$WORK/previous.json" \
              --endpoint-url "$TILES_R2_ENDPOINT" --only-show-errors
          else
            echo "No current.json in the bucket yet: this is the first build."
          fi

      - name: Build the tiles
        id: build
        env:
          BOUNDS: ${{ steps.area.outputs.bounds }}
        run: |
          build_date="$(date -u +%F)"
          echo "build_date=$build_date" >> "$GITHUB_OUTPUT"
          scripts/tiles/build.sh "$WORK" "$BOUNDS" "$build_date"
          echo "extract_date=$(cat "$WORK/extract-date.txt")" >> "$GITHUB_OUTPUT"
          # Unique per run, so a second upload on the same day never reuses a name.
          mv "$WORK/parapo.pmtiles" "$WORK/parapo-$build_date-$GITHUB_RUN_ID.pmtiles"

      - name: Check the file
        env:
          BUILD_DATE: ${{ steps.build.outputs.build_date }}
          EXTRACT_DATE: ${{ steps.build.outputs.extract_date }}
        run: |
          previous=()
          [ -f "$WORK/previous.json" ] && previous=("$WORK/previous.json")
          node scripts/tiles/check.mjs "$WORK/parapo-$BUILD_DATE-$GITHUB_RUN_ID.pmtiles" "$WORK/current.json" "${previous[@]}"

      - name: Get the styles, sprite and glyphs
        run: node scripts/tiles/fetch-assets.mjs "$WORK/assets"

      - name: Upload to R2
        if: env.SHOULD_UPLOAD == 'true'
        env:
          TILES_R2_ENDPOINT: ${{ secrets.TILES_R2_ENDPOINT }}
          TILES_R2_BUCKET: ${{ secrets.TILES_R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TILES_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TILES_R2_SECRET_ACCESS_KEY }}
          BUILD_DATE: ${{ steps.build.outputs.build_date }}
        run: |
          previous=()
          [ -f "$WORK/previous.json" ] && previous=("$WORK/previous.json")
          scripts/tiles/upload.sh "$WORK/parapo-$BUILD_DATE-$GITHUB_RUN_ID.pmtiles" "$WORK/current.json" "$WORK/assets" "${previous[@]}"
          scripts/tiles/sources.sh push "$WORK/data/sources"

      - name: Write the summary
        if: always()
        run: |
          {
            echo "### Tiles"
            echo "Upload: ${SHOULD_UPLOAD/true/yes}"
            if [ -f "$WORK/current.json" ]; then
              printf '\n```json\n%s\n```\n' "$(cat "$WORK/current.json")"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # When the run failed: opens or updates this workflow's `alert` issue, naming the run
  # (scripts/watch/report-failed-run.mjs, shared with the watch). A job of its own, so the
  # job above keeps its permissions and a run that fails at its checkout is still reported.
  alert:
    needs: tiles
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/watch
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Open or update the alert issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.workflow }}
          WORKFLOW_FILE: tiles.yml
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/watch/report-failed-run.mjs
