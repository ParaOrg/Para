# Two checks a change can fail without anyone noticing: a secret in the
# history, and a production dependency with a known hole.
#
# gitleaks reads every commit a change adds: on a pull request, the commits
# between its base and its head; on a push to main or staging, the nightly run
# and "Run workflow", the whole history. What is public on purpose (the
# publishable key in .env.production, among others) is listed in
# .gitleaks.toml, as narrowly as it can be said.
#
# A finding is printed with the secret redacted. If one is real, removing the
# file in a new commit is not enough: the old commit still holds it. Rotate the
# key first, then ask the owner about rewriting history.
#
# gitleaks runs as its release binary, checked against the release's
# checksum, so the workflow needs no third-party action.
#
# npm audit reads package-lock.json against the npm advisory database and fails
# on a high or critical advisory in what ships to commuters (dependencies, not
# devDependencies). It needs no install. When it fails, `npm audit` locally
# names the package and the version that fixes it; Dependabot opens most of
# these on its own.
#
# A second audit reads the devDependencies too: the tools that build and check
# the app. Nothing of theirs reaches a commuter, so it blocks nothing: the job
# may fail and the run still passes (continue-on-error). It is there so a hole
# in a dev tool is seen in the nightly run, not found by chance. It does not run
# on a pull request, where a red mark that means "not yours" would only confuse.
name: Security

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
  schedule:
    # 05:30 in Manila (UTC+8), after CI's nightly run.
    - cron: '30 21 * * *'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: No secrets in the history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The release is kept in Actions' cache, by its version, so a GitHub release download outage
      # (2026-11-08) does not turn the check red; the checksum is checked either way.
      - uses: actions/cache@v6
        with:
          path: gitleaks.tar.gz
          key: gitleaks-8.30.1-linux-x64

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          if [ ! -f gitleaks.tar.gz ]; then
            curl -sSfL --retry 3 -o gitleaks.tar.gz \
              "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          fi
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            ./gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="${BASE}..HEAD"
          else
            ./gitleaks git . --config .gitleaks.toml --redact --no-banner
          fi

  audit:
    name: No known holes in production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  dev-audit:
    name: Known holes in the dev tools (report only)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm audit, dev tools included
        run: npm audit --audit-level=high
