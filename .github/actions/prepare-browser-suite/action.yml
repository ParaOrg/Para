name: Prepare a browser suite
description: Node, the packages (node_modules, kept between runs; npm ci when the lockfile or Node changed), and Playwright's Chromium with its system packages, both kept between runs. Run after checkout.
runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version: 22

    # node_modules itself, kept between runs. `npm ci` unpacks about 690 packages every time, even
    # from npm's download cache: 38 s at the median, in every job. The key is the lockfile, the
    # Node that ran any install script, and the runner's system and chip, so a change to any of
    # them installs afresh; there is no fallback key, so what is restored is never another
    # lockfile's packages. It is saved straight after `npm ci`, before anything else writes
    # into node_modules (Vite's and Storybook's own caches), so every job restores the same files.
    - id: modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json') }}

    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}

    # Playwright's Chromium, at the version package-lock pins, and the .deb files of its system
    # packages, kept between runs. Every job that calls this action shares the two caches: the
    # keys below are the ones the jobs used when each held these steps itself.
    # The runner image is in the key too, so a new Ubuntu does not restore an old Chromium:
    # ImageOS is set on the runner, not in the env context.
    - id: playwright
      shell: bash
      run: |
        echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
        echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
        echo "image-version=$ImageVersion" >> "$GITHUB_OUTPUT"

    - id: chromium
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

    - if: steps.chromium.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install chromium

    - id: debs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/apt-debs
        key: playwright-debs-${{ runner.os }}-${{ steps.playwright.outputs.image-version }}-${{ steps.playwright.outputs.version }}

    # From the cached .deb files when they restore; install-deps otherwise (and when dpkg
    # refuses them), which then leaves its downloads in ~/apt-debs for the next run to cache.
    - name: Install Chromium's system packages
      shell: bash
      run: |
        if [ "${{ steps.debs.outputs.cache-hit }}" = true ] && sudo dpkg -i ~/apt-debs/*.deb; then
          exit 0
        fi
        npx playwright install-deps chromium
        mkdir -p ~/apt-debs
        cp /var/cache/apt/archives/*.deb ~/apt-debs/
