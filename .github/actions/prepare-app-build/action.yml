name: Prepare the app build
description: Node, Java 21, the Android platform and build tools, Gradle, and npm ci. Run after checkout.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        cache: npm

    # Capacitor 8 needs Java 21.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21

    # The runner image carries the SDK; make sure the platform and build tools Capacitor 8
    # asks for are there.
    - name: Install the Android platform and build tools
      shell: bash
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

    # Gradle's own distribution and the dependencies are cached in Gradle's home. setup-gradle
    # writes that cache only on the default branch (main) unless told otherwise, so pull requests
    # into staging found none and downloaded Gradle every time: a services.gradle.org outage
    # (2026-11-08) turned them red. staging writes it too, and its pull requests read it.
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

    - shell: bash
      run: npm ci
